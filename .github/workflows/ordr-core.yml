# Drift guard for the vendored Ordr POS pricing module
# (supabase/functions/_shared/ordr-core/, see scripts/check-ordr-core.mjs).
name: ordr-core

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Vendored bytes match VENDORED.json; nothing else in ordr-core/.
      - run: npm run check:ordr-core
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.3
      # The module type-checks under Deno, as the edge functions run it.
      - run: deno check --no-lock supabase/functions/_shared/ordr-core/money.ts supabase/functions/_shared/ordr-core/order/*.ts
      # pos-v1 pricing function: loader, handler and the 13 POS golden orders.
      - run: deno test --no-lock --allow-read=supabase/functions/_shared supabase/functions/_shared/pos-v1/tests/
