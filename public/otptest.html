<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OTP Autofill Test</title>
</head>
<body style="padding:40px;font-family:system-ui;-apple-system,sans-serif">
  <h2>OTP autofill test</h2>
  <p>Tap the field below, then send the verification SMS.</p>
  <form>
    <input
      id="otp"
      type="text"
      inputmode="numeric"
      autocomplete="one-time-code"
      maxlength="6"
      placeholder="------"
      style="font-size:32px;letter-spacing:8px;width:100%;padding:12px;box-sizing:border-box"
      autofocus>
  </form>
  <p id="status" style="font-size:20px;color:#16A34A;margin-top:24px"></p>
  <script>
    var el = document.getElementById('otp');
    el.addEventListener('input', function () {
      if (el.value.length === 6) {
        document.getElementById('status').textContent = 'Autofire would trigger now: ' + el.value;
      }
    });
  </script>
</body>
</html>
